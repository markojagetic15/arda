# Read by /var/www/backup/backup.sh (any /var/www/<project>/backup.conf is picked up).
# The code is in git; this covers the database (users, tree, comments and every
# page's Yjs content in document_snapshots), uploaded images and the deployment config.
DB_SERVICE=db
DB_USER=arda
DB_NAME=arda
PATHS="uploads .env docker-compose.prod.yml backup.conf caddy"
# Services to stop during ./backup/restore.sh (everything except the DB).
APP_SERVICES="backend frontend redis"
