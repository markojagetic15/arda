# SPA fallback: React Router owns every path, so unknown paths serve index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        # Vite emits content-hashed filenames, safe to cache forever.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # index.html must never be cached, or users keep loading old bundles.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
